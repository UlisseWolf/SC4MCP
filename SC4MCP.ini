; SC4MCP - MCP server for SimCity 4.
; Put this file next to SC4MCP.dll, in the top level of the Plugins folder.
; Lines that start with ; are comments. Restart the game after a change.

[SC4MCP]
; 1 = start the MCP server when the game starts, 0 = do nothing.
Enabled=1

; TCP port on 127.0.0.1. The server never listens on other network cards.
; The MCP endpoint is http://127.0.0.1:<Port>/mcp
Port=8765

; 1 = the client may pause the game, change the speed and let months pass (set_speed, wait_months), and change
; funding, taxes and ordinances and save the city (set_funding, set_building_funding, set_tax, set_ordinance,
; save_city). 0 = these tools are not offered.
AllowControl=1

; 1 = the client may run cheat codes (run_cheat), including the cheats of other DLL plugins.
AllowCheats=1

; 1 = the client may change the zones of the city (place_zone). Changing the zone of a developed lot demolishes it,
; which place_zone does only when the client passes allow_demolition=true.
AllowBuild=1

; Optional password. When set, every request to /mcp must carry the header "Authorization: Bearer <AuthToken>".
; Leave it empty on a PC used only by you; set it if anything else could reach the port (for example a tunnel).
AuthToken=
